# --------------------------------------------------------------------------
#   Angannondir
#   The Iron Gatekeeper
# --------------------------------------------------------------------------
#   Services related to access and authentication.
# --------------------------------------------------------------------------
services:
  # Cloudflare (https://github.com/favonia/cloudflare-ddns)
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    cap_drop:
      - all
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Los_Angeles}
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/api_cloudflare
      DOMAINS: ${DOMAINS:-changeMe.biz}
      IP6_PROVIDER: "none"
      PROXIED: "TRUE"
    secrets:
      - api_cloudflare
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-1000}:${PGID:-1000}"
    deploy:
      labels:
        - homepage.instance.admin.group=Angannondír
        - homepage.instance.admin.name=Cloudflare DDNS
        - homepage.instance.admin.description=Dynamic DNS updater for Cloudflare
        - homepage.instance.admin.icon=cloudflare.svg
      placement:
        constraints:
          - node.labels.pi4 == true

  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
    networks:
      - gulhir
    ports:
      - 127.0.0.1:2375:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      placement:
        constraints:
          - node.role == manager

  # NGINX Proxy Manager (https://github.com/NginxProxyManager/nginx-proxy-manager)
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Los_Angeles}
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: 5432
      DB_POSTGRES_USER__FILE: /run/secrets/root_username
      DB_POSTGRES_PASSWORD__FILE: /run/secrets/root_password
      DB_POSTGRES_NAME__FILE: /run/secrets/nginx_proxy_manager_database
      DISABLE_IPV6: "TRUE"
      HOMEPAGE_FILE_USERNAME: /run/secrets/root_email
      HOMEPAGE_FILE_PASSWORD: /run/secrets/nginx_proxy_manager_password
    networks:
      - gulhir
    ports:
      - 80:80
      - 443:443
      - 81:81
    secrets:
      - nginx_proxy_manager_database
      - nginx_proxy_manager_password
      - root_email
      - root_password
      - root_username

    volumes:
      - ${BASE_PATH:-.}/nginx-proxy-manager/data:/data
      - ${BASE_PATH:-.}/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    depends_on:
      - mysql
    deploy:
      labels:
        - homepage.instance.admin.description=Reverse proxy manager
        - homepage.instance.admin.href=${NGINX_PROXY_MANAGER_URL:-http://localhost}
        - homepage.instance.admin.icon=nginx-proxy-manager.svg
        - homepage.instance.admin.group=Angannondír
        - homepage.instance.admin.name=NGINX Proxy Manager
        - homepage.instance.admin.widget.type=npm
        - homepage.instance.admin.widget.url=${MANAGER_IP:-http://localhost}:81
        - homepage.instance.admin.widget.username=${HOMEPAGE_FILE_USERNAME}
        - homepage.instance.admin.widget.password=${HOMEPAGE_FILE_PASSWORD}
        - homepage.instance.admin.widget.fields=["enabled", "disabled", "total"]
      placement:
        constraints:
          - node.role == manager

  # Tailscale (https://tailscale.com)
  tailscale:
    image: tailscale/tailscale:latest
    hostname: enedos-gateway
    cap_add:
      - NET_ADMIN
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      TS_AUTHKEY: file:/run/secrets/tailscale_authkey
      TS_ROUTES: ${NETWORK_RANGE:-10.0.1.0/24}
      TS_EXTRA_ARGS: --advertise-exit-node --hostname=enedos-gateway
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    secrets:
      - tailscale_authkey
    volumes:
      - ${BASE_PATH:-.}/tailscale:/var/lib/tailscale
    deploy:
      labels:
        - homepage.instance.admin.group=Angannondír
        - homepage.instance.admin.name=Tailscale
        - homepage.instance.admin.description=Subnet router and exit node for remote LAN access
        - homepage.instance.admin.icon=tailscale.svg
      placement:
        constraints:
          - node.role == manager

networks:
  gulhir:
    external: true

secrets:
  api_cloudflare:
    external: true
  authentik_database:
    external: true
  authentik_secret_key:
    external: true
  nginx_proxy_manager_database:
    external: true
  nginx_proxy_manager_password:
    external: true
  root_email:
    external: true
  root_password:
    external: true
  root_username:
    external: true
  tailscale_authkey:
    external: true

volumes:
  gogiwnadh-storage-authentik-certs:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_IP},${NAS_OPTIONS}
      device: :${GOGIWNADH_PATH_SERVICES}/authentik/certs
  gogiwnadh-storage-authentik-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_IP},${NAS_OPTIONS}
      device: :${GOGIWNADH_PATH_SERVICES}/authentik/media
  gogiwnadh-storage-authentik-templates:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_IP},${NAS_OPTIONS}
      device: :${GOGIWNADH_PATH_SERVICES}/authentik/templates
